[project]
name = "foosball-tracking"
version = "0.1.0"
description = "Table and ball detection in foosball videos."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "json-with-comments>=1.2,<2",
    "numpy>=2.2,<3",
    "opencv-python>=4.11,<5",
    "pydantic>=2.10,<3",
]

[project.scripts]
foosball = "foosball_tracking.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "mypy>=2.4,<3",
    "pylint>=4.1,<5",
    "poethepoet>=0.35,<1",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
no-build = false

[tool.ruff]
target-version = "py313"
line-length = 79
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["src", "scripts"]
exclude = [".venv", "archive"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.13"
files = ["src", "scripts"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/typings"]

[tool.pylint.main]
prefer-stubs = true

[tool.poe.tasks.diagrams]
help = "Build all TikZ diagrams or one by its stem."
cmd = "python scripts/diagrams.py"
cwd = "."

[tool.poe.tasks.diagrams-clean]
help = "Remove generated SVG diagrams and temporary build files."
cmd = "python scripts/diagrams.py --clean"
cwd = "."

[tool.poe.tasks.performance]
help = "Plot ball detection and tracking coverage from JSON exports."
cmd = "python scripts/performance.py"
cwd = "."
